---
name: Validate

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@f63b85534ce3a561f177c4ee3417b17c04f14a8b  # v0.83.1
    permissions:
      contents: read
      # GitHub validates the optional nested publisher's permissions even when
      # publish-validation-report is disabled (the default).
      pull-requests: write
    with:
      egress-policy: audit
      script: scripts/ci/validate.sh
