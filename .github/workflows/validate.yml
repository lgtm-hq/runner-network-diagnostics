---
name: Validate

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@7fbf5075f8e0296624e56ec7c8ee7ce7ed1c790e  # v0.83.2
    permissions:
      contents: read
      # GitHub validates the optional nested publisher's permissions even when
      # publish-validation-report is disabled (the default).
      pull-requests: write
    with:
      egress-policy: audit
      script: scripts/ci/validate.sh
