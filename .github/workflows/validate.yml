---
name: Validate

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@e119ddbc8ba1fe611ed10163b2b2748d5148ab6a  # v0.83.12
    permissions:
      contents: read
      # GitHub validates the optional nested publisher's permissions even when
      # publish-validation-report is disabled (the default).
      pull-requests: write
    with:
      egress-policy: audit
      script: scripts/ci/validate.sh
