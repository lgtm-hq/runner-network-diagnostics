---
name: Validate

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@761e2f173be08f57f0be18d8332e2b063387d987  # v0.83.9
    permissions:
      contents: read
      # GitHub validates the optional nested publisher's permissions even when
      # publish-validation-report is disabled (the default).
      pull-requests: write
    with:
      egress-policy: audit
      script: scripts/ci/validate.sh
