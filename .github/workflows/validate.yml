---
name: Validate

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@614c5ad1fc91d742baed959643bdd1f261a71210 # v0.79.1
    permissions:
      contents: read
    with:
      egress-policy: audit
      script: scripts/ci/validate.sh
