---
name: Validate

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8  # v0.116.3
    permissions:
      contents: read
      # GitHub validates the optional nested publisher's permissions even when
      # publish-validation-report is disabled (the default).
      pull-requests: write
    with:
      egress-policy: audit
      script: scripts/ci/validate.sh
